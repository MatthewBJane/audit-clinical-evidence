# ACE-RIV: the ACE taxonomy of Research Integrity Violations.
#
# Single source of truth for the numbers, names and counting units.
# riv.qmd builds its quick-reference table from this file, the report
# helpers (riv_summary_table) validate report labels against it, and
# scripts/riv_check.py checks riv.qmd and every report for drift.
#
# Definitions, criteria and evidence live as prose in riv.qmd. Numbers are
# stable: never renumber or reuse a number; append new categories at the end
# of a section and bump `version` (minor for additions/clarifications, major
# for any change to what an existing number means).
#
# Earlier versions are kept in _riv-versions/ (riv-1.0.yml, ...). A published
# report reads the version it was written under: its frozen helpers.R points
# riv_summary_table() at that file, so a new version never relabels it.

version: "2.0"
date: "2026-10-10"
url: "https://auditclinicalevidence.org/riv.html"

sections:
  - number: 1
    title: Authorship and Publication
    categories:
      - number: "1.1"
        name: Guest, Honorary, or Gift Authorship
        unit: credited author, per article
      - number: "1.2"
        name: Ghost Authorship
        unit: omitted contributor (article if unidentifiable)
      - number: "1.3"
        name: Authorship for Sale and Paper Mill Activity
        unit: article
      - number: "1.4"
        name: Plagiarism
        unit: passage, figure, or table
      - number: "1.5"
        name: Duplicate Publication and Salami Slicing
        unit: redundant article
      - number: "1.6"
        name: Citation Manipulation
        unit: article
      - number: "1.7"
        name: Peer Review Subversion
        unit: article
      - number: "1.8"
        name: Irrelevant Citations and Reference Padding
        unit: article
      - number: "1.9"
        name: Trial Registration Failures and Outcome Switching
        unit: unregistered trial, or switched outcome
      - number: "1.10"
        name: Incompatible Authorship or Contribution Statements
        unit: article
      - number: "1.11"
        name: Misrepresentation of Cited Sources
        unit: citation
      - number: "1.12"
        name: Undisclosed Generated Text
        unit: article
  - number: 2
    title: Statistical and Data Integrity
    categories:
      - number: "2.1"
        name: Anomalies and Extreme Values
        unit: anomalous value
      - number: "2.2"
        name: Statistical Inconsistencies and Impossible Data Sets
        unit: impossible statistic
      - number: "2.3"
        name: Selective Reporting, Suppressed Data, and Omitted Methodology
        unit: omitted outcome, analysis, or method element
      - number: "2.4"
        name: Data Miscalculation or Erroneous Reporting
        unit: incorrect value
      - number: "2.5"
        name: Image and Figure Manipulation
        unit: image or panel
      - number: "2.6"
        name: Data Set Anomalies
        unit: distinct anomaly
      - number: "2.7"
        name: Image and Figure Errors
        unit: figure or panel
  - number: 3
    title: Ethical Oversight and Transparency
    categories:
      - number: "3.1"
        name: Failure to Disclose Conflicts of Interest
        unit: undisclosed interest, per article
      - number: "3.2"
        name: Bypass of Ethical Oversight
        unit: article
      - number: "3.3"
        name: Ethics Approval Anomalies
        unit: article
      - number: "3.4"
        name: Implausible Study Timelines
        unit: article
      - number: "3.5"
        name: False or Unfulfilled Data Availability Statements
        unit: article
  - number: 4
    title: Indicators and Minor Issues
    categories:
      - number: "4.1"
        name: Minor Typographical Error
        unit: error
      - number: "4.2"
        name: Indicators of Paper Mill Involvement
        unit: article
      - number: "4.3"
        name: Tortured Phrases and Text Spinners
        unit: article
