format:
  html:
    echo: true
    css: ../../styles.css
    toc: true
    mainfont: "Roboto, sans-serif"
    monofont: "Roboto Mono, monospace"
    code-fold: true
    code-summary: "Show code"
    code-overflow: wrap
    code-copy: true
    number-depth: 3
    # Sidebar download button. Quarto's automatic "Other Formats" link always
    # appends the extension name ("PDF (acePDF)"), so it is switched off and
    # each report declares its own link under `other-links` (see _template.qmd).
    format-links: false
    language:
      other-links-title: "Download"
    # Report-page scripts (alpha subsection numbers, ACE ID pill). Path is
    # relative to each report file, like `css` above.
    include-after-body:
      # term -> facet map, written by scripts/build_categories.py (project
      # pre-render); tints the category chips in the title block.
      - file: ../../_includes/category-facets.html
      - file: ../_includes/report-scripts.html
      - file: ../_includes/title-block.html
    # "Citation" appendix (APA + BibTeX) generated from title/subtitle/authors/
    # ace-id/date/doi, so nothing is written twice. Replaces Quarto's cite-as.
    filters:
      - ../_filters/ace-citation.lua
      - ../_filters/ace-riv-links.lua   # @riv-x.y -> **Name (RIV x.y)** linked to riv.html#riv-x-y
  acePDF-pdf:
    echo: false
    top-level-division: section
    toc: true
    toc-title: "Sections"
    toc-depth: 3
    shift-heading-level-by: -1
    header-includes:
      - \graphicspath{{./}{../}{../../}}
    filters:
      - ../_extensions/ace-formatting/acePDF/fields.lua
      - ../_filters/ace-riv-links.lua   # @riv-x.y labels (needed in every format)
      - quarto                          # position marker: the next filter runs after Quarto's
      - ../_filters/ace-pdf-xrefs.lua   # "Figure 1" / "Table 2" / "Section 2.1" fully linked

number-sections: true
google-scholar: true      # citation_* meta tags for Google Scholar indexing
bibliography: ../references/references.bib
csl: ../references/ace.csl

fig-pos: H

execute:
  warning: false
  message: false
  fig-dpi: 300
# Code is shown (folded) in HTML only; never in the PDF. Set per format below
# rather than via `!expr` here, which Quarto does not evaluate at this level.

# The graphics device (ragg_png, transparent background) is set at runtime in
# reports/helpers/themes.R: declared here, Quarto merges its own per-format
# dev.args (a `pdf` entry) into the list and ragg::agg_png rejects them.
  

comments:
  giscus:
    repo: matthewbjane/audit-clinical-evidence
    mapping: pathname
    category: "Report Comments"
    reactions-enabled: false
    input-position: bottom
    loading: lazy
    theme:
      light: light
      dark: dark_dimmed

link-citations: true      # in-text citations link to the reference list (HTML and PDF)
appendix-cite-as: false   # replaced by _filters/ace-citation.lua
# Constant across every ACE report (read by acePDF/fields.lua for the cover).
Journal: "Audit Clinical Evidence"

# Rendered in each report's appendix under "Reuse".
license: "CC BY"
